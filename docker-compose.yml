services:
  postgres: {image: postgres:16, environment: {POSTGRES_USER: flash, POSTGRES_PASSWORD: flash, POSTGRES_DB: flashsale}, ports: ["5432:5432"], volumes: ["pgdata:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d"]}
  redis: {image: redis:7, ports: ["6379:6379"]}
  rabbitmq: {image: rabbitmq:3.13-management, environment: {RABBITMQ_DEFAULT_USER: flash, RABBITMQ_DEFAULT_PASS: flash}, ports: ["5672:5672","15672:15672"]}
  api: {build: ., environment: {DATABASE_URL: postgres://flash:flash@postgres:5432/flashsale?sslmode=disable, REDIS_ADDR: redis:6379, RABBITMQ_URL: amqp://flash:flash@rabbitmq:5672/, CHECKOUT_RATE_RPS: 20000, ADMISSION_CAPACITY: 100000, PUBLISHER_CHANNELS: 32, SALE_START: 2026-10-29T20:00:00Z}, healthcheck: {test: [CMD, /healthcheck], interval: 5s, timeout: 2s, retries: 10}, depends_on: [postgres,redis,rabbitmq]}
  worker: {build: ., entrypoint: ["/worker"], environment: {DATABASE_URL: postgres://flash:flash@postgres:5432/flashsale?sslmode=disable, RABBITMQ_URL: amqp://flash:flash@rabbitmq:5672/, REDIS_ADDR: redis:6379, WORKER_PREFETCH: 64, WORKER_CONCURRENCY: 16}, depends_on: [postgres,rabbitmq,redis]}
  nginx: {image: nginx:1.27, ports: ["8080:80"], volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro", "./nginx-upstream.conf:/etc/nginx/conf.d/api-upstream.conf:ro", "./frontend/dist:/usr/share/nginx/html:ro"], depends_on: [api]}
volumes: {pgdata: {}}
