services:
  postgres: {image: postgres:16, environment: {POSTGRES_USER: flash, POSTGRES_PASSWORD: flash, POSTGRES_DB: flashsale}, ports: ["5432:5432"], volumes: ["pgdata:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d"]}
  redis: {image: redis:7, ports: ["6379:6379"]}
  rabbitmq: {image: rabbitmq:3.13-management, environment: {RABBITMQ_DEFAULT_USER: flash, RABBITMQ_DEFAULT_PASS: flash}, ports: ["5672:5672","15672:15672"]}
  api: {build: ., environment: {DATABASE_URL: postgres://flash:flash@postgres:5432/flashsale?sslmode=disable, REDIS_ADDR: redis:6379, SALE_START: 2026-10-29T20:00:00Z}, depends_on: [postgres,redis,rabbitmq]}
  worker: {build: ., command: ["/worker"], environment: {DATABASE_URL: postgres://flash:flash@postgres:5432/flashsale?sslmode=disable, RABBITMQ_URL: amqp://flash:flash@rabbitmq:5672/}, depends_on: [postgres,rabbitmq]}
  nginx: {image: nginx:1.27, ports: ["8080:80"], volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro", "./frontend/dist:/usr/share/nginx/html:ro"], depends_on: [api]}
volumes: {pgdata: {}}
