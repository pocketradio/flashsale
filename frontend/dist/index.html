<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Sale</title></head><body><main><h1>Flash Sale</h1><p id="clock">Loading sale time…</p><button id="buy">Buy smartphone</button><p id="status"></p></main><script>const b=document.querySelector('#buy'),o=document.querySelector('#status'),c=document.querySelector('#clock');let t=sessionStorage.getItem('tracking_id');let start;function show(s,m){o.textContent=s+(m?': '+m:'');b.disabled=['SUBMITTING','QUEUED','PROCESSING','CONFIRMED','SOLD_OUT'].includes(s)}async function poll(){if(!t)return;let d=400;for(;;){let r=await fetch('/api/v1/checkout-status/'+t),j=await r.json();show(j.status);if(['CONFIRMED','SOLD_OUT','FAILED'].includes(j.status))return;await new Promise(x=>setTimeout(x,d+Math.random()*200));d=Math.min(5000,d*1.7)}}b.onclick=async()=>{let k=sessionStorage.getItem('idempotency_key')||crypto.randomUUID();sessionStorage.setItem('idempotency_key',k);show('SUBMITTING');let r=await fetch('/api/v1/checkout',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':k,'X-User-ID':'demo-user'},body:JSON.stringify({product_id:'phone-500',quantity:1})}),j=await r.json();if(!r.ok){show(j.status,j.error);return}t=j.tracking_id;sessionStorage.setItem('tracking_id',t);show(j.status);poll()};fetch('/api/v1/time').then(r=>r.json()).then(j=>{start=Date.parse(j.sale_start);setInterval(()=>{let d=Math.max(0,start-Date.now());c.textContent=d?'Sale opens in '+Math.ceil(d/1000)+'s':'Sale is live'},250)});if(t)poll();</script></body></html>
