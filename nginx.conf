events {}
http { limit_req_zone $binary_remote_addr zone=checkout:10m rate=20r/s; gzip on; server { listen 80; root /usr/share/nginx/html; location /api/v1/checkout { limit_req zone=checkout burst=40 nodelay; proxy_pass http://api:8080; proxy_set_header X-User-ID $http_x_user_id; proxy_set_header Idempotency-Key $http_idempotency_key; } location /api/ { proxy_pass http://api:8080; } location / { try_files $uri /index.html; add_header Cache-Control "public,max-age=31536000,immutable"; } } }
