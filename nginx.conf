worker_processes auto; events { worker_connections 8192; multi_accept on; } http { include /etc/nginx/conf.d/api-upstream.conf; limit_req_zone $binary_remote_addr zone=checkout:10m rate=1000r/s; limit_req_status 429; add_header Retry-After 1 always; keepalive_timeout 65; keepalive_requests 10000; gzip on; upstream api_pool { least_conn; server api:8080; keepalive 128; } server { listen 80; root /usr/share/nginx/html; client_max_body_size 16k; location = /healthz { proxy_pass http://api_pool_dynamic/healthz; proxy_connect_timeout 1s; } location = /metrics { proxy_pass http://api_pool_dynamic/metrics; } location /api/v1/checkout { limit_req zone=checkout burst=100 nodelay; proxy_pass http://api_pool_dynamic; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header X-User-ID $http_x_user_id; proxy_set_header Idempotency-Key $http_idempotency_key; proxy_next_upstream error timeout non_idempotent; proxy_next_upstream_tries 3; } location /api/v1/checkout-status/ { proxy_pass http://api_pool_dynamic; proxy_http_version 1.1; proxy_buffering off; } location /api/ { proxy_pass http://api_pool_dynamic; proxy_http_version 1.1; } location / { try_files $uri /index.html; add_header Cache-Control "public,max-age=31536000,immutable"; } } }
